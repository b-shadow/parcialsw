name: case-inteligente-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate AI engine
        working-directory: ai-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest

      - name: Validate backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ../ai-engine
          python -m ruff check app tests
          python -m pytest

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test -- --run
          npm run build

      - name: Build Docker images
        run: |
          docker build -f backend/Dockerfile -t case-inteligente-backend:${{ github.sha }} .
          docker build -f frontend/Dockerfile.runtime -t case-inteligente-frontend:${{ github.sha }} .
          docker build -f ai-engine/Dockerfile -t case-inteligente-ai-engine:${{ github.sha }} .
