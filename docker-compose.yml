services:
  postgres:
    image: postgres:16
    container_name: case-inteligente-postgres
    environment:
      POSTGRES_DB: case_inteligente
      POSTGRES_USER: case_user
      POSTGRES_PASSWORD: case_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_user -d case_inteligente"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: case-inteligente-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: case_user
      MONGO_INITDB_ROOT_PASSWORD: case_password
      MONGO_INITDB_DATABASE: case_inteligente_nosql
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "case_user", "--password", "case_password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
