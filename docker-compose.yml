services:
  postgres:
    image: postgres:16
    container_name: case-inteligente-postgres
    environment:
      POSTGRES_DB: case_inteligente
      POSTGRES_USER: case_user
      POSTGRES_PASSWORD: case_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_user -d case_inteligente"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: case-inteligente-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
