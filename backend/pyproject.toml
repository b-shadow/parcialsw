[project]
name = "case-inteligente-backend"
version = "0.1.0"
description = "Backend principal FastAPI para la plataforma CASE inteligente."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<5.0.0",
  "python-multipart>=0.0.9",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.0.0",
  "pytesseract>=0.3.13",
  "pymongo>=4.11.0,<5.0.0",
  "pywebpush>=2.0.3,<3.0.0",
  "redis>=5.0,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "fakeredis>=2.20"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Estos adaptadores son fronteras de tolerancia a fallos: Redis, WebSocket y
# enriquecimientos opcionales nunca deben interrumpir la transaccion principal.
"app/core/changelog/*.py" = ["BLE001", "S110"]
"app/core/redis/client.py" = ["BLE001"]
"app/modules/acceso_usuarios/services/audit_service.py" = ["BLE001", "S110"]
"app/modules/asistente_proyecto/services/context_builder.py" = ["BLE001"]
"app/modules/asistente_proyecto/services/proactive_advisor_service.py" = ["BLE001", "S110"]
"app/modules/proyectos_colaboracion/validators/project_validator.py" = ["BLE001", "S110"]

[tool.pytest.ini_options]
pythonpath = ["../ai-engine"]
