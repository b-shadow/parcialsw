services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-case_inteligente}
      POSTGRES_USER: ${POSTGRES_USER:-case_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-case_user} -d ${POSTGRES_DB:-case_inteligente}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-case_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-case_inteligente}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - generated_artifacts:/storage/generated
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.runtime
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: ai-engine/Dockerfile
    restart: "no"

volumes:
  postgres_data:
  generated_artifacts:
